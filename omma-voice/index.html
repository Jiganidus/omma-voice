<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6A62">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Omma's Voice</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} [hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: one-screen phone app. Top bar (call + settings), then a main pane with a right-hand tab rail. */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --ink:#13201E; --muted:#51635F; --line:#C3D0CB;
  --accent:#0B6A62; --accent-ink:#FFFFFF; --soft:#DCEEEA; --call:#C2410C; --call-ink:#FFFFFF;
  --danger:#A61B1B; --font:"Noto Sans CJK KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1514; --surface:#18221F; --ink:#E9F1EF; --muted:#9DB2AD; --line:#2D3C38;
    --accent:#45B8AB; --accent-ink:#04201D; --soft:#1E3330; --call:#F08A4B; --call-ink:#1B0A00;
    --danger:#F07A7A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#18221F; --ink:#E9F1EF; --muted:#9DB2AD; --line:#2D3C38;
  --accent:#45B8AB; --accent-ink:#04201D; --soft:#1E3330; --call:#F08A4B; --call-ink:#1B0A00;
  --danger:#F07A7A; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:18px;
  padding-block:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent; overscroll-behavior:none;
}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none; touch-action:manipulation}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
svg{width:28px;height:28px;flex:none}
#app{height:100%; display:flex; flex-direction:column; gap:10px; min-width:0}

.top{display:flex; gap:10px}
.warn{padding:10px 14px; border-radius:12px; background:var(--soft); border:2px solid var(--call); font-size:16px; font-weight:700; line-height:1.35}
.warn small{display:block; font-weight:500; font-size:13px; color:var(--muted)}
.call{flex:1; min-width:0; height:64px; border-radius:14px; background:var(--call); color:var(--call-ink);
  display:flex; align-items:center; justify-content:center; gap:10px; font-weight:900; font-size:22px}
.call small{font-weight:500; font-size:13px; opacity:.9; display:block; line-height:1}
.call span{text-align:left; line-height:1.15}
.sq{width:64px; height:64px; border-radius:14px; background:var(--surface); border:2px solid var(--line); display:grid; place-items:center}

.body{flex:1; min-height:0; display:flex; gap:10px}
main{flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; gap:10px}
.view{flex:1; min-height:0; display:flex; flex-direction:column; gap:10px}

#box{flex:1; min-height:120px; width:100%; resize:none; font:inherit; font-size:30px; line-height:1.35; font-weight:500;
  padding:14px; border-radius:14px; border:2px solid var(--line); background:var(--surface); color:var(--ink)}
#box::placeholder{color:var(--muted); font-size:22px}
#chips{display:flex; flex-wrap:wrap; gap:8px; min-height:56px; align-content:flex-start; max-height:132px; overflow:hidden}
.chip{min-height:52px; max-width:100%; padding:8px 14px; border-radius:12px; font-size:21px; font-weight:700; text-align:left;
  background:var(--soft); border:2px solid transparent; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.chip.word{background:var(--surface); border-color:var(--accent)}
.chip:active,.act:active,.tile:active,.tab:active{transform:scale(.97)}

.acts{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.act{height:56px; border-radius:12px; background:var(--surface); border:2px solid var(--line); font-weight:700; font-size:19px}
.act:disabled{opacity:.4}
.speak{grid-column:1/-1; height:76px; border-radius:14px; background:var(--accent); color:var(--accent-ink); border:0; font-size:30px; font-weight:900; display:flex; align-items:center; justify-content:center; gap:12px}
.speak.on{background:var(--danger); color:#fff}

.said{min-height:60px; padding:10px 14px; border-radius:14px; background:var(--soft); font-size:22px; font-weight:700; line-height:1.3; overflow-wrap:anywhere}
.said em{display:block; font-style:normal; font-size:13px; font-weight:500; color:var(--muted)}
.vhead{display:flex; align-items:center; justify-content:space-between; gap:8px}
.vhead h2{margin:0; font-size:22px; font-weight:900; min-width:0; overflow-wrap:anywhere}
.mini{min-height:44px; padding:6px 12px; border-radius:10px; border:2px solid var(--line); background:var(--surface); font-weight:700; font-size:16px}
#grid{flex:1; min-height:0; overflow-y:auto; display:grid; grid-template-columns:1fr 1fr; gap:10px; align-content:start; padding-bottom:6px}
.tile{min-height:92px; padding:10px; border-radius:14px; background:var(--surface); border:2px solid var(--line); font-size:22px; font-weight:700; line-height:1.25; overflow-wrap:anywhere; display:flex; align-items:center; justify-content:center; text-align:center}
.tile.editing{border-style:dashed; border-color:var(--accent)}
.tile.add{border-style:dashed; color:var(--accent); font-size:20px}
.empty{grid-column:1/-1; color:var(--muted); font-size:18px; padding:12px}

#rail{width:76px; flex:none; display:flex; flex-direction:column; gap:8px; overflow-y:auto; min-height:0}
.tab{min-height:66px; padding:6px 4px; border-radius:12px; background:var(--surface); border:2px solid var(--line); font-weight:700; font-size:18px; line-height:1.15; overflow-wrap:anywhere; flex:none}
.tab[aria-selected="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.tab.tool{min-height:52px; font-size:15px; border-style:dashed}
.tab.tool.live{background:var(--soft); border-color:var(--accent)}
.spacer{flex:1}

.modal{position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.5); display:flex; align-items:flex-end}
.panel{width:100%; max-height:92%; overflow-y:auto; background:var(--bg); border-radius:18px 18px 0 0;
  padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display:flex; flex-direction:column; gap:12px}
.panel h3{margin:0; font-size:22px}
.panel label{display:flex; flex-direction:column; gap:6px; font-weight:700; font-size:16px}
.panel input[type=text],.panel textarea,.panel select{font:inherit; font-size:22px; padding:12px; border-radius:12px; border:2px solid var(--line); background:var(--surface); color:var(--ink); width:100%}
.panel textarea{min-height:90px; resize:vertical}
.panel input[type=range]{width:100%; height:36px; accent-color:var(--accent)}
.row{display:flex; gap:8px; flex-wrap:wrap}
.row>*{flex:1; min-width:120px}
.btn{min-height:52px; padding:8px 14px; border-radius:12px; border:2px solid var(--line); background:var(--surface); font-weight:700; font-size:18px}
.btn.pri{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.bad{color:var(--danger); border-color:var(--danger)}
.hint{margin:0; font-size:14px; color:var(--muted); line-height:1.4}

#callOverlay{position:fixed; inset:0; z-index:30; background:var(--call); color:var(--call-ink); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; padding:24px}
#callOverlay .big{font-size:54px; font-weight:900; animation:pulse 1s ease-in-out infinite}
#callOverlay .stop{min-height:84px; width:min(100%,360px); border-radius:18px; background:var(--call-ink); color:var(--call); font-size:30px; font-weight:900}
@keyframes pulse{50%{opacity:.45}}
#toast{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:40; background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:12px; font-weight:700; font-size:16px; max-width:90%; text-align:center}
@media (prefers-reduced-motion: reduce){#callOverlay .big{animation:none} .chip:active,.act:active,.tile:active,.tab:active{transform:none}}
</style>

<div id="app">
  <header class="top">
    <button id="callBtn" class="call" type="button" aria-label="사람 부르기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span>사람 부르기<small>Call attention</small></span>
    </button>
    <button id="settingsBtn" class="sq" type="button" aria-label="설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <div id="noTts" class="warn" hidden>이 화면에서는 음성이 나오지 않아요. 휴대폰의 Chrome 앱에서 이 페이지를 열어 주세요.<small>Voice isn't available in this view. Open this page in the Chrome app.</small></div>
  <div class="body">
    <main>
      <section id="writeView" class="view">
        <textarea id="box" rows="4" placeholder="여기에 입력하세요" aria-label="말할 내용" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
        <div id="chips" aria-label="추천 단어와 문장"></div>
        <div class="acts">
          <button id="speakBtn" class="speak" type="button">말하기</button>
          <button id="clearBtn" class="act" type="button">지우기</button>
          <button id="prevBtn" class="act" type="button">◀ 이전</button>
          <button id="nextBtn" class="act" type="button">다음 ▶</button>
        </div>
      </section>
      <section id="phraseView" class="view" hidden>
        <div class="vhead"><h2 id="tabTitle"></h2><button id="renameBtn" class="mini" type="button" hidden>이름 바꾸기</button></div>
        <div id="said" class="said" hidden></div>
        <div id="grid"></div>
      </section>
    </main>
    <nav id="rail" aria-label="탭"></nav>
  </div>
</div>

<div id="editModal" class="modal" hidden>
  <div class="panel" role="dialog" aria-labelledby="editTitle">
    <h3 id="editTitle">문구 편집</h3>
    <label>문구<textarea id="edText" rows="2"></textarea></label>

<div id="tabModal" class="modal" hidden>

<div id="setModal" class="modal" hidden>

    <h3>백업</h3>

    <div class="row"><button id="bkCopy" class="btn" type="button">백업 복사</button><button id="bkShow" class="btn" type="button">불러오기</button></div>
    <textarea id="bkText" rows="4" hidden aria-label="백업 내용"></textarea>
    <div class="row" id="bkRow" hidden><button id="bkApply" class="btn pri" type="button">이 내용으로 복원</button></div>
    <button id="resetBtn" class="btn bad" type="button">처음 상태로 되돌리기</button>

  </div>
</div>

<div id="callOverlay" hidden role="alertdialog" aria-label="부르는 중">
  <div class="big">부르는 중…</div>
  <button id="callStop" class="stop" type="button">멈추기</button>
</div>
<div id="toast" hidden role="status"></div>

<script>
// ---- Pure logic (no DOM): Hangul-aware matching, prediction, history ----
var CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
var JUNG=['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
var JONG=['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
var JUNG_SPLIT={'ㅘ':'ㅗㅏ','ㅙ':'ㅗㅐ','ㅚ':'ㅗㅣ','ㅝ':'ㅜㅓ','ㅞ':'ㅜㅔ','ㅟ':'ㅜㅣ','ㅢ':'ㅡㅣ'};
var JONG_SPLIT={'ㄳ':'ㄱㅅ','ㄵ':'ㄴㅈ','ㄶ':'ㄴㅎ','ㄺ':'ㄹㄱ','ㄻ':'ㄹㅁ','ㄼ':'ㄹㅂ','ㄽ':'ㄹㅅ','ㄾ':'ㄹㅌ','ㄿ':'ㄹㅍ','ㅀ':'ㄹㅎ','ㅄ':'ㅂㅅ'};

// Break text into basic jamo so a half-typed syllable (무 -> 물) still matches.
function jamo(str){
  var out='';
  for(var i=0;i<str.length;i++){
    var c=str.charCodeAt(i);
    if(c>=0xAC00&&c<=0xD7A3){
      var n=c-0xAC00, j=n%28, v=Math.floor(n/28)%21, l=Math.floor(n/588);
      var vv=JUNG[v], jj=JONG[j];
      out+=CHO[l]+(JUNG_SPLIT[vv]||vv)+(JONG_SPLIT[jj]||jj);
    }else if(c>=0x3131&&c<=0x318E){
      var ch=str.charAt(i);
      out+=JUNG_SPLIT[ch]||JONG_SPLIT[ch]||ch;
    }else out+=str.charAt(i).toLowerCase();
  }
  return out;
}

var BASE_WORDS=['안녕하세요','감사합니다','고맙습니다','사랑해요','괜찮아요','아파요','화장실','병원','의사','간호사','약','밥','식사','물','커피','차','따뜻한','시원한','베개','이불','침대','휠체어','텔레비전','전화','가족','아들','딸','며느리','손녀','손자','친구','오늘','내일','어제','지금','나중에','조금만','많이','천천히','도와주세요','주세요','해 주세요','싶어요','힘들어요','피곤해요','졸려요','배고파요','목말라요','불편해요','춥고','더워요','창문','불','문','음악','기도','교회','잘 지냈어요','보고 싶어요','미안해요','잠깐만요'];

function wordsOf(s){return s.split(/[\s,.?!…]+/).filter(Boolean)}

function rank(list){
  return list.sort(function(a,b){return (b.n-a.n)||((b.t||0)-(a.t||0))});
}

// model: {sents:{text:{n,t}}, words:{w:{n,t}}, items:[strings from phrase tiles]}
function predict(text, model, max){
  max=max||4;
  var sents=[], words=[], seenS={}, seenW={};
  var all=text||'';
  var trimmed=all.trim();
  var pool={};
  Object.keys(model.sents).forEach(function(k){pool[k]={text:k,n:model.sents[k].n+1,t:model.sents[k].t}});
  (model.items||[]).forEach(function(k){if(!pool[k])pool[k]={text:k,n:1,t:0}});
  var cands=rank(Object.keys(pool).map(function(k){return pool[k]}));
  if(!trimmed){
    return cands.slice(0,max).map(function(c){return {kind:'sentence',text:c.text}});
  }
  var jt=jamo(all.replace(/\s+$/,' '));
  var jtt=jamo(trimmed);
  cands.forEach(function(c){
    var jc=jamo(c.text);
    var ok=(all.slice(-1)===' ')?jc.indexOf(jtt+' ')===0:jc.indexOf(jtt)===0;
    if(ok&&jc.length>jtt.length&&!seenS[c.text]){seenS[c.text]=1;sents.push({kind:'sentence',text:c.text})}
  });
  var last=all.slice(-1)===' '?'':(all.match(/[^\s]+$/)||[''])[0];
  if(last){
    var jl=jamo(last);
    var wp={};
    Object.keys(model.words).forEach(function(w){wp[w]={text:w,n:model.words[w].n+1,t:model.words[w].t}});
    BASE_WORDS.concat((model.items||[]).reduce(function(a,s){return a.concat(wordsOf(s))},[])).forEach(function(w){if(!wp[w])wp[w]={text:w,n:0,t:0}});
    rank(Object.keys(wp).map(function(k){return wp[k]})).forEach(function(c){
      var jc=jamo(c.text);
      if(jc.indexOf(jl)===0&&jc.length>jl.length&&!seenW[c.text]){seenW[c.text]=1;words.push({kind:'word',text:c.text})}
    });
  }
  var out=[], s=sents.slice(0,2), w=words.slice(0,2);
  out=s.concat(w);
  var i=2;
  while(out.length<max&&(sents[i]||words[i])){ if(sents[i]&&out.length<max)out.push(sents[i]); if(words[i]&&out.length<max)out.push(words[i]); i++; }
  return out.slice(0,max);
}

function applySuggestion(text, sug){
  if(sug.kind==='sentence')return sug.text;
  var m=text.match(/^([\s\S]*?)([^\s]+)$/);
  var head=m?m[1]:text;
  return head+sug.text+' ';
}

function pushHist(hist, text, limit){
  var t=(text||'').trim();
  if(!t)return hist;
  if(hist.length&&hist[hist.length-1]===t)return hist;
  hist.push(t);
  while(hist.length>(limit||100))hist.shift();
  return hist;
}

function histPrev(hist, hp){
  if(!hist.length)return null;
  if(hp===null||hp===undefined)return hist.length-1;
  return Math.max(0,hp-1);
}
function histNext(hist, hp){
  if(hp===null||hp===undefined)return null;
  return hp+1>=hist.length?null:hp+1;
}

var DEFAULT_TABS=[
  {name:'건강',items:['물 주세요','밥 먹여 주세요','숨쉬기 힘들어요','아파요','자세를 바꿔 주세요','화장실에 가고 싶어요','추워요','더워요','베개를 고쳐 주세요','가래를 빼 주세요','약 주세요','침대를 올려 주세요']},
  {name:'가족',items:['잘 지냈어요?','밥 먹었어요?','오늘 뭐 했어요?','사랑해요','고마워요','보고 싶었어요','미안해요','와 줘서 고마워요','조심히 가세요','잠깐만요, 생각 중이에요']},
  {name:'대화',items:['네','아니요','맞아요','잘 모르겠어요','잠깐만요','다시 말해 주세요','천천히 말해 주세요','좋아요','괜찮아요','그만할게요']}
];

if(typeof module!=='undefined')module.exports={jamo:jamo,predict:predict,applySuggestion:applySuggestion,pushHist:pushHist,histPrev:histPrev,histNext:histNext,DEFAULT_TABS:DEFAULT_TABS};

// ---- App: storage, rendering, speech, attention sound ----
(function(){
var $=function(id){return document.getElementById(id)};
var KEY='mal-helper-v1';
var LANGS=[['ko-KR','한국어 (Korean)'],['en-AU','English (Australia)'],['zh-CN','中文 (Mandarin)'],['ja-JP','日本語 (Japanese)'],['vi-VN','Tiếng Việt (Vietnamese)'],['es-ES','Español (Spanish)'],['ar-SA','العربية (Arabic)'],['hi-IN','हिन्दी (Hindi)']];
var HELLO={ko:'안녕하세요, 목소리 테스트입니다',en:'Hello, this is my voice',zh:'你好，这是我的声音',ja:'こんにちは、声のテストです',vi:'Xin chào, đây là giọng của tôi',es:'Hola, esta es mi voz',ar:'مرحبا، هذا صوتي',hi:'नमस्ते, यह मेरी आवाज़ है'};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var S, hp=null, editMode=false, speaking=false, noStoreWarned=false;
var editCtx=null, tabCtx=null, delArmed={};

function defaults(){
  return {v:1,cur:'write',draft:'',hist:[],stats:{sents:{},words:{}},
    set:{lang:'ko-KR',voice:'',rate:1,vol:1},
    tabs:DEFAULT_TABS.map(function(t){return {id:uid(),name:t.name,items:t.items.map(function(x){return {id:uid(),text:x}})}})};
}
function sane(d){
  if(!d||!Array.isArray(d.tabs))return null;
  var base=defaults();
  d.hist=Array.isArray(d.hist)?d.hist:[];
  d.stats=d.stats&&d.stats.sents&&d.stats.words?d.stats:base.stats;
  d.set=Object.assign({},base.set,d.set||{});
  d.cur=d.cur||'write'; d.draft=d.draft||'';
  d.tabs=d.tabs.filter(function(t){return t&&t.name&&Array.isArray(t.items)}).map(function(t){return {id:t.id||uid(),name:String(t.name),items:t.items.filter(function(i){return i&&i.text}).map(function(i){return {id:i.id||uid(),text:String(i.text)}})}});
  return d;
}
function load(){
  try{var raw=localStorage.getItem(KEY); if(raw){var d=sane(JSON.parse(raw)); if(d)return d}}catch(e){}
  return defaults();
}
var saveT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(function(){
    try{localStorage.setItem(KEY,JSON.stringify(S))}
    catch(e){ if(!noStoreWarned){noStoreWarned=true;toast('이 브라우저에서는 저장이 안 될 수 있어요')} }
  },150);
}
var toastT=null;
function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2600)}

function model(){
  var items=[]; S.tabs.forEach(function(t){t.items.forEach(function(i){items.push(i.text)})});
  return {sents:S.stats.sents,words:S.stats.words,items:items};
}

// ---------- Speech ----------
var voices=[];
function voiceScore(v){
  var n=v.name||'',s=0;
  if(/neural|natural|premium|enhanced|wavenet|online/i.test(n))s+=4;
  if(/google/i.test(n))s+=2;
  if(v.localService===false)s+=2;
  if((v.lang||'').replace('_','-').toLowerCase()===S.set.lang.toLowerCase())s+=1;
  return s;
}
function langVoices(){
  var pre=S.set.lang.slice(0,2);
  return voices.filter(function(v){return (v.lang||'').toLowerCase().replace('_','-').indexOf(pre)===0}).sort(function(a,b){return voiceScore(b)-voiceScore(a)});
}
function pickVoice(){var l=langVoices();return l[0]||null}
function refreshVoices(){
  if(!('speechSynthesis' in window))return;
  voices=speechSynthesis.getVoices()||[];
  var sel=$('setVoice'), pre=S.set.lang.slice(0,2);
  var list=langVoices();
  sel.innerHTML='';
  var auto=document.createElement('option');auto.value='';auto.textContent='자동 (가장 자연스러운 목소리)';sel.appendChild(auto);
  list.forEach(function(v){var o=document.createElement('option');o.value=v.name;o.textContent=v.name+' ('+v.lang+')';sel.appendChild(o)});
  sel.value=S.set.voice&&list.some(function(v){return v.name===S.set.voice})?S.set.voice:'';
}
function say(text){
  if(!('speechSynthesis' in window)){$('noTts').hidden=false;toast('이 화면에서는 음성이 안 나와요. Chrome 앱에서 열어 주세요');return false}
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);
  u.lang=S.set.lang; u.rate=S.set.rate; u.volume=S.set.vol;
  var v=voices.filter(function(x){return x.name===S.set.voice})[0]||pickVoice();
  if(v)u.voice=v;
  u.onstart=function(){speaking=true;paintSpeak()};
  u.onend=u.onerror=function(){speaking=false;paintSpeak()};
  speaking=true;paintSpeak();
  speechSynthesis.speak(u);
  return true;
}
function stopSay(){try{speechSynthesis.cancel()}catch(e){} speaking=false;paintSpeak()}
function paintSpeak(){
  var b=$('speakBtn');
  b.textContent=speaking?'멈추기':'말하기';
  b.classList.toggle('on',speaking);
}
function record(text){
  var t=text.trim(); if(!t)return;
  var now=Date.now(), s=S.stats.sents[t]||{n:0,t:0}; s.n++; s.t=now; S.stats.sents[t]=s;
  wordsOf(t).forEach(function(w){var o=S.stats.words[w]||{n:0,t:0};o.n++;o.t=now;S.stats.words[w]=o});
  var keys=Object.keys(S.stats.sents);
  if(keys.length>400){keys.sort(function(a,b){return S.stats.sents[a].t-S.stats.sents[b].t}).slice(0,keys.length-400).forEach(function(k){delete S.stats.sents[k]})}
  pushHist(S.hist,t,100);
  save();
}

// ---------- Write view ----------
var box=$('box');
function renderChips(){
  var box_=$('chips'); box_.innerHTML='';
  predict(box.value,model(),4).forEach(function(sug){
    var b=document.createElement('button');
    b.type='button'; b.className='chip '+(sug.kind==='word'?'word':'sent');
    b.textContent=sug.text;
    b.addEventListener('click',function(){
      box.value=applySuggestion(box.value,sug);
      onType(true);
      box.focus(); box.setSelectionRange(box.value.length,box.value.length);
    });
    box_.appendChild(b);
  });
}
function paintNav(){
  $('prevBtn').disabled=!S.hist.length||hp===0;
  $('nextBtn').disabled=hp===null;
}
function onType(fromChip){
  if(!fromChip||true){hp=null}
  S.draft=box.value; save(); renderChips(); paintNav();
}
box.addEventListener('input',function(){onType(false)});

$('speakBtn').addEventListener('click',function(){
  if(speaking){stopSay();return}
  var t=box.value.trim();
  if(!t){toast('먼저 내용을 입력하세요');return}
  if(say(t)){record(t);renderChips();paintNav()}
});
$('clearBtn').addEventListener('click',function(){
  var t=box.value.trim();
  if(t){pushHist(S.hist,t,100)}
  box.value=''; hp=null; S.draft=''; save(); renderChips(); paintNav(); box.focus();
});
$('prevBtn').addEventListener('click',function(){
  var cur=box.value.trim();
  if(hp===null&&cur){pushHist(S.hist,cur,100);hp=S.hist.length-1}
  var i=histPrev(S.hist,hp);
  if(i===null)return;
  hp=i; box.value=S.hist[i]; S.draft=box.value; save(); renderChips(); paintNav();
});
$('nextBtn').addEventListener('click',function(){
  var i=histNext(S.hist,hp);
  hp=i;
  box.value=i===null?'':S.hist[i];
  S.draft=box.value; save(); renderChips(); paintNav();
});

// ---------- Tabs ----------
function curTab(){return S.tabs.filter(function(t){return t.id===S.cur})[0]||null}
function renderRail(){
  var r=$('rail'); r.innerHTML='';
  function mk(label,cls,fn,selected){
    var b=document.createElement('button');b.type='button';b.className='tab '+(cls||'');b.textContent=label;
    if(selected!==undefined)b.setAttribute('aria-selected',selected?'true':'false');
    b.addEventListener('click',fn);r.appendChild(b);return b;
  }
  mk('쓰기','',function(){S.cur='write';save();renderAll()},S.cur==='write');
  S.tabs.forEach(function(t){mk(t.name,'',function(){S.cur=t.id;save();renderAll()},S.cur===t.id)});
  if(editMode)mk('+ 탭','tool',function(){openTab(null)});
  var sp=document.createElement('div');sp.className='spacer';r.appendChild(sp);
  mk(editMode?'완료':'편집','tool'+(editMode?' live':''),function(){editMode=!editMode;renderAll()});
}
function renderView(){
  var t=curTab();
  var write=!t;
  $('writeView').hidden=!write; $('phraseView').hidden=write;
  if(write){renderChips();paintNav();return}
  $('tabTitle').textContent=t.name;
  $('renameBtn').hidden=!editMode;
  var g=$('grid'); g.innerHTML='';
  t.items.forEach(function(it){
    var b=document.createElement('button');b.type='button';b.className='tile'+(editMode?' editing':'');b.textContent=it.text;
    b.addEventListener('click',function(){
      if(editMode){openEdit(t.id,it.id);return}
      if(say(it.text)){record(it.text);showSaid(it.text)}
    });
    g.appendChild(b);
  });
  if(editMode){
    var a=document.createElement('button');a.type='button';a.className='tile add';a.textContent='+ 문구 추가';
    a.addEventListener('click',function(){openEdit(t.id,null)});g.appendChild(a);
  }else if(!t.items.length){
    var e=document.createElement('div');e.className='empty';e.textContent='아직 문구가 없어요. 아래 "편집"을 눌러 추가하세요.';g.appendChild(e);
  }
}
function showSaid(text){
  var s=$('said');s.hidden=false;s.innerHTML='';
  var em=document.createElement('em');em.textContent='방금 말한 내용';s.appendChild(em);
  s.appendChild(document.createTextNode(text));
}
function renderAll(){
  if(S.cur!=='write'&&!curTab())S.cur='write';
  renderRail();renderView();
  $('said').hidden=true;
}
$('renameBtn').addEventListener('click',function(){var t=curTab();if(t)openTab(t.id)});

// ---------- Modals ----------
function show(id){$(id).hidden=false}
function hide(id){$(id).hidden=true}
['editModal','tabModal','setModal'].forEach(function(id){
  $(id).addEventListener('click',function(e){if(e.target===$(id))hide(id)});
});
function arm(key,btn,idle,fn){
  if(delArmed[key]){delArmed[key]=false;btn.textContent=idle;fn();return}
  delArmed[key]=true;btn.textContent='정말 삭제?';
  setTimeout(function(){if(delArmed[key]){delArmed[key]=false;btn.textContent=idle}},3500);
}
function tabById(id){return S.tabs.filter(function(t){return t.id===id})[0]}

function openEdit(tabId,itemId){
  editCtx={tabId:tabId,itemId:itemId};
  var t=tabById(tabId), it=itemId&&t.items.filter(function(i){return i.id===itemId})[0];
  $('editTitle').textContent=it?'문구 편집':'문구 추가';
  $('edText').value=it?it.text:'';
  $('edDel').hidden=!it; $('edLeft').hidden=!it; $('edRight').hidden=!it;
  delArmed.item=false; $('edDel').textContent='삭제';
  show('editModal'); $('edText').focus();
}
$('edSave').addEventListener('click',function(){
  var v=$('edText').value.trim(); if(!v){toast('문구를 입력하세요');return}
  var t=tabById(editCtx.tabId);
  if(editCtx.itemId){t.items.forEach(function(i){if(i.id===editCtx.itemId)i.text=v})}
  else t.items.push({id:uid(),text:v});
  save();hide('editModal');renderAll();
});
$('edCancel').addEventListener('click',function(){hide('editModal')});
$('edDel').addEventListener('click',function(){
  arm('item',$('edDel'),'삭제',function(){
    var t=tabById(editCtx.tabId);
    t.items=t.items.filter(function(i){return i.id!==editCtx.itemId});
    save();hide('editModal');renderAll();
  });
});
function moveItem(d){
  var t=tabById(editCtx.tabId), i=t.items.findIndex(function(x){return x.id===editCtx.itemId}), j=i+d;
  if(i<0||j<0||j>=t.items.length)return;
  var x=t.items[i];t.items[i]=t.items[j];t.items[j]=x;save();renderView();
}
$('edLeft').addEventListener('click',function(){moveItem(-1)});
$('edRight').addEventListener('click',function(){moveItem(1)});

function openTab(id){
  tabCtx=id;
  var t=id&&tabById(id);
  $('tabModalTitle').textContent=t?'탭 편집':'새 탭';
  $('tabName').value=t?t.name:'';
  ['tabDel','tabLeft','tabRight'].forEach(function(k){$(k).hidden=!t});
  delArmed.tab=false;$('tabDel').textContent='탭 삭제';
  show('tabModal');$('tabName').focus();
}
$('tabSave').addEventListener('click',function(){
  var v=$('tabName').value.trim(); if(!v){toast('이름을 입력하세요');return}
  if(tabCtx){tabById(tabCtx).name=v}
  else{var n={id:uid(),name:v,items:[]};S.tabs.push(n);S.cur=n.id}
  save();hide('tabModal');renderAll();
});
$('tabCancel').addEventListener('click',function(){hide('tabModal')});
$('tabDel').addEventListener('click',function(){
  arm('tab',$('tabDel'),'탭 삭제',function(){
    S.tabs=S.tabs.filter(function(t){return t.id!==tabCtx});S.cur='write';save();hide('tabModal');renderAll();
  });
});
function moveTab(d){
  var i=S.tabs.findIndex(function(t){return t.id===tabCtx}), j=i+d;
  if(i<0||j<0||j>=S.tabs.length)return;
  var x=S.tabs[i];S.tabs[i]=S.tabs[j];S.tabs[j]=x;save();renderRail();
}
$('tabLeft').addEventListener('click',function(){moveTab(-1)});
$('tabRight').addEventListener('click',function(){moveTab(1)});

// ---------- Settings ----------
function openSettings(){
  var sel=$('setLang');
  if(!sel.options.length)LANGS.forEach(function(l){var o=document.createElement('option');o.value=l[0];o.textContent=l[1];sel.appendChild(o)});
  sel.value=S.set.lang;$('setRate').value=S.set.rate;$('setVol').value=S.set.vol;
  $('bkText').hidden=true;$('bkRow').hidden=true;
  delArmed.reset=false;$('resetBtn').textContent='처음 상태로 되돌리기';
  refreshVoices();show('setModal');
}
$('settingsBtn').addEventListener('click',openSettings);
$('setClose').addEventListener('click',function(){hide('setModal')});
$('setLang').addEventListener('change',function(){S.set.lang=$('setLang').value;S.set.voice='';save();refreshVoices()});
$('setVoice').addEventListener('change',function(){S.set.voice=$('setVoice').value;save()});
$('setRate').addEventListener('input',function(){S.set.rate=parseFloat($('setRate').value);save()});
$('setVol').addEventListener('input',function(){S.set.vol=parseFloat($('setVol').value);save()});
$('testVoice').addEventListener('click',function(){say(HELLO[S.set.lang.slice(0,2)]||HELLO.en)});
$('testCall').addEventListener('click',function(){ensureAudio();chime(0)});
function backupJson(){return JSON.stringify({v:1,tabs:S.tabs,hist:S.hist,stats:S.stats,set:S.set})}
$('bkCopy').addEventListener('click',function(){
  var j=backupJson(), ta=$('bkText');
  function fallback(){ta.hidden=false;ta.value=j;ta.focus();ta.select();toast('내용을 길게 눌러 복사하세요')}
  try{navigator.clipboard.writeText(j).then(function(){toast('백업을 복사했어요')},fallback)}catch(e){fallback()}
});
$('bkShow').addEventListener('click',function(){$('bkText').hidden=false;$('bkText').value='';$('bkRow').hidden=false;$('bkText').focus()});
$('bkApply').addEventListener('click',function(){
  try{
    var d=sane(JSON.parse($('bkText').value));
    if(!d)throw new Error('bad');
    S=d;save();hp=null;box.value=S.draft;renderAll();hide('setModal');toast('복원했어요');
  }catch(e){toast('백업 내용이 올바르지 않아요')}
});
$('resetBtn').addEventListener('click',function(){
  var b=$('resetBtn');
  if(delArmed.reset){delArmed.reset=false;b.textContent='처음 상태로 되돌리기';S=defaults();save();hp=null;box.value='';renderAll();hide('setModal');toast('처음 상태로 되돌렸어요');return}
  delArmed.reset=true;b.textContent='정말 되돌릴까요? 한 번 더 누르세요';
  setTimeout(function(){if(delArmed.reset){delArmed.reset=false;b.textContent='처음 상태로 되돌리기'}},4000);
});

// ---------- Attention sound ----------
var actx=null, master=null, callTimer=null, callStopTimer=null;
function ensureAudio(){
  if(!actx){
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    actx=new AC(); master=actx.createGain(); master.gain.value=1;
    var comp=actx.createDynamicsCompressor(); master.connect(comp); comp.connect(actx.destination);
  }
  if(actx.state==='suspended')actx.resume();
}
// Two-note bell (high then lower), bright but soft-edged: loud enough to carry, not a siren.
function chime(delay){
  if(!actx)return;
  var t0=actx.currentTime+(delay||0)+0.02;
  [[880,0],[659.25,0.5]].forEach(function(n){
    [[1,0.55],[2.01,0.22],[3.02,0.1]].forEach(function(p){
      var o=actx.createOscillator(), g=actx.createGain(), s=t0+n[1];
      o.type='sine'; o.frequency.value=n[0]*p[0];
      g.gain.setValueAtTime(0.0001,s); g.gain.linearRampToValueAtTime(p[1],s+0.01); g.gain.exponentialRampToValueAtTime(0.0001,s+1.3);
      o.connect(g); g.connect(master); o.start(s); o.stop(s+1.4);
    });
  });
}
function startCall(){
  ensureAudio(); stopSay();
  $('callOverlay').hidden=false;
  function ring(){chime(0);try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(e){}}
  ring(); callTimer=setInterval(ring,2600);
  callStopTimer=setTimeout(stopCall,90000);
}
function stopCall(){
  clearInterval(callTimer);clearTimeout(callStopTimer);callTimer=null;
  $('callOverlay').hidden=true;
  try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}
}
$('callBtn').addEventListener('click',startCall);
$('callStop').addEventListener('click',stopCall);
$('callOverlay').addEventListener('click',function(e){if(e.target===$('callOverlay'))stopCall()});

// ---------- Boot ----------
S=load();
box.value=S.draft||'';
if('speechSynthesis' in window){refreshVoices();speechSynthesis.onvoiceschanged=refreshVoices}
if(!('speechSynthesis' in window))$('noTts').hidden=false;
paintSpeak();renderAll();
})();

</script>
